<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주차장 담당자 Agent</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    background: #f5f5f7;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 640px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fff;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #e5e5e5;
    font-weight: 600;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
  }
  .user {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    white-space: pre-wrap;
  }
  .agent {
    align-self: flex-start;
    background: #f0f0f2;
    color: #111;
    max-width: 95%;
  }
  .agent.pending {
    color: #888;
  }
  .agent p {
    margin: 0 0 8px;
  }
  .agent p:last-child {
    margin-bottom: 0;
  }
  .agent table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    margin: 4px 0 8px;
    display: block;
    overflow-x: auto;
  }
  .agent th, .agent td {
    border: 1px solid #d5d5d8;
    padding: 6px 10px;
    text-align: left;
    white-space: nowrap;
  }
  .agent th {
    background: #e8e8ec;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid #e5e5e5;
  }
  input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled {
    background: #aaa;
    cursor: default;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
</head>
<body>
<div id="app">
  <header>주차장 담당자 Agent</header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" type="text" placeholder="예: 지금 주차 가능한 자리가 몇 개야?" autocomplete="off" />
    <button id="send" type="submit">전송</button>
  </form>
</div>

<script>
const messagesEl = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMessage(text, role) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

function renderAgentMessage(el, text) {
  el.innerHTML = marked.parse(text);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  addMessage(question, 'user');
  input.value = '';
  sendBtn.disabled = true;
  const pending = addMessage('생각 중...', 'agent pending');

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) throw new Error('서버 오류: ' + res.status);
    const data = await res.json();
    renderAgentMessage(pending, data.answer);
    pending.classList.remove('pending');
  } catch (err) {
    pending.textContent = '오류가 발생했습니다: ' + err.message;
    pending.classList.remove('pending');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
