<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주차장 담당자 Agent</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    background: #f5f5f7;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 960px;
    height: 100vh;
    display: flex;
    background: #fff;
  }

  /* 왼쪽 메뉴: 이 에이전트한테 뭘 물어볼 수 있는지 카테고리별로 보여주는 목록 */
  #menu {
    width: 250px;
    flex-shrink: 0;
    border-right: 1px solid #e5e5e5;
    overflow-y: auto;
    background: #fafafa;
  }
  /* 접혔을 때는 아예 안 그려서 채팅 영역이 넓어지게 한다 */
  #app.menu-hidden #menu {
    display: none;
  }
  #menu-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 8px 12px 16px;
    border-bottom: 1px solid #e5e5e5;
  }
  #menu-head h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
  }
  #menuToggle {
    background: none;
    border: none;
    font-size: 16px;
    line-height: 1;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    color: #444;
  }
  #menuToggle:hover {
    background: #e8e8ec;
  }
  /* 메뉴가 접혔을 때 채팅 헤더 쪽에 다시 펼치는 버튼 */
  #menuShowBtn {
    display: none;
    margin-right: 10px;
  }
  #app.menu-hidden #menuShowBtn {
    display: inline-block;
  }
  .menu-group {
    padding: 12px 8px;
    border-bottom: 1px solid #ececec;
  }
  .menu-group h2 {
    font-size: 12px;
    font-weight: 700;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 8px 6px;
  }
  .menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 7px 8px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.4;
    color: #222;
    cursor: pointer;
  }
  .menu-item:hover {
    background: #e8edfc;
  }

  /* 오른쪽 채팅 패널 */
  #chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid #e5e5e5;
    font-weight: 600;
  }
  header .spacer {
    flex: 1;
  }
  #pdfBtn {
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 500;
    color: #444;
    cursor: pointer;
  }
  #pdfBtn:hover {
    background: #f0f0f2;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
  }
  .user {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    white-space: pre-wrap;
  }
  .agent {
    align-self: flex-start;
    background: #f0f0f2;
    color: #111;
    max-width: 95%;
  }
  .agent.pending {
    color: #888;
  }
  .agent p {
    margin: 0 0 8px;
  }
  .agent p:last-child {
    margin-bottom: 0;
  }
  .agent table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    margin: 4px 0 8px;
    display: block;
    overflow-x: auto;
  }
  .agent th, .agent td {
    border: 1px solid #d5d5d8;
    padding: 6px 10px;
    text-align: left;
    white-space: nowrap;
  }
  .agent th {
    background: #e8e8ec;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid #e5e5e5;
  }
  input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled {
    background: #aaa;
    cursor: default;
  }

  @media (max-width: 640px) {
    #app { flex-direction: column; height: auto; min-height: 100vh; }
    #menu { width: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid #e5e5e5; }
  }

  /* "PDF로 저장" 버튼은 브라우저의 인쇄 대화상자를 그대로 이용한다(대상을 "PDF로 저장"으로 고르면
     다운로드가 됨). 인쇄될 때는 메뉴·입력창처럼 대화 내용이 아닌 것들은 다 지우고, 스크롤로 잘려
     있던 대화 전체가 여러 페이지로 자연스럽게 이어지도록 높이 제약을 푼다. */
  @media print {
    body { background: #fff; }
    #menu, #menuShowBtn, #pdfBtn, form { display: none !important; }
    #app, #chat, #messages { height: auto !important; overflow: visible !important; }
    .msg { break-inside: avoid; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
</head>
<body>
<div id="app">
  <nav id="menu">
    <div id="menu-head">
      <h1>무엇을 물어볼 수 있나요?</h1>
      <button id="menuToggle" type="button" title="메뉴 접기">◀</button>
    </div>
    <!-- 각 항목의 data-q 값을 클릭하면 그 질문을 그대로 물어본다. 카테고리는 감독자가 위임하는
         하위 에이전트(조회/요금/관리자) 구성과 그대로 맞춰뒀다 -->
    <div class="menu-group">
      <h2>🚗 조회</h2>
      <button class="menu-item" data-q="지금 주차 가능한 자리가 몇 개야?">지금 주차 가능한 자리 몇 개?</button>
      <button class="menu-item" data-q="91라1409 차량 입출입 기록 알려줘">특정 차량 입출입 기록</button>
      <button class="menu-item" data-q="영업팀 차량들 입출입 현황 보여줘">부서별 차량 현황</button>
      <button class="menu-item" data-q="최근에 입차한 차량 5대 알려줘">최근 입차 차량</button>
      <button class="menu-item" data-q="전기차 있어?">전기차/SUV 등 자연어로 찾기</button>
    </div>
    <div class="menu-group">
      <h2>💰 요금 · 환불</h2>
      <button class="menu-item" data-q="27허2679 주차 요금 얼마야?">주차 요금 계산</button>
      <button class="menu-item" data-q="환불 정책이 뭐야?">정기권 환불 정책</button>
      <button class="menu-item" data-q="82라2200 환불 얼마나 받을 수 있어?">정기권 환불 금액 계산</button>
    </div>
    <div class="menu-group">
      <h2>📋 관리자 전용</h2>
      <button class="menu-item" data-q="등록된 차량 전체 명단을 차주 이름까지 같이 보여줘">전체 차량 명단(차주 이름 포함)</button>
      <button class="menu-item" data-q="정기권 차량 목록 조회해줘">정기권 차량만 보기</button>
      <button class="menu-item" data-q="방문객 차량만 보여줘">방문객 차량만 보기</button>
    </div>
    <div class="menu-group">
      <h2>ℹ️ 안내</h2>
      <button class="menu-item" data-q="이 에이전트는 어떻게 만들어졌어? 구조를 설명해줘">이 에이전트 구조 설명</button>
    </div>
  </nav>

  <div id="chat">
    <header>
      <button id="menuShowBtn" type="button" title="메뉴 펼치기">☰</button>
      주차장 담당자 Agent
      <span class="spacer"></span>
      <button id="pdfBtn" type="button" title="지금까지의 대화를 PDF로 저장">PDF로 저장</button>
    </header>
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="예: 지금 주차 가능한 자리가 몇 개야?" autocomplete="off" />
      <button id="send" type="submit">전송</button>
    </form>
  </div>
</div>

<script>
const appEl = document.getElementById('app');
const messagesEl = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const menu = document.getElementById('menu');
const menuToggle = document.getElementById('menuToggle');
const menuShowBtn = document.getElementById('menuShowBtn');
const pdfBtn = document.getElementById('pdfBtn');

// 별도 PDF 생성 라이브러리 없이, 브라우저 인쇄 기능을 그대로 이용한다. 인쇄 대화상자에서
// 대상(프린터)을 "PDF로 저장"으로 고르면 그대로 다운로드된다. @media print 스타일이 메뉴/입력창을
// 지우고 대화 내용만 페이지에 흐르도록 되어 있다(<style> 쪽 참고).
pdfBtn.addEventListener('click', () => window.print());

// 메뉴 접힘 상태는 이 브라우저에서만 기억하면 되는 사소한 취향이라 localStorage에 둔다.
// 개인정보나 공유 데이터가 아니라서 못 읽어도(시크릿 모드 등) 그냥 펼친 채로 시작하면 그만이다.
function setMenuHidden(hidden) {
  appEl.classList.toggle('menu-hidden', hidden);
  try {
    localStorage.setItem('menuHidden', hidden ? '1' : '0');
  } catch (_) {}
}

try {
  if (localStorage.getItem('menuHidden') === '1') setMenuHidden(true);
} catch (_) {}

menuToggle.addEventListener('click', () => setMenuHidden(true));
menuShowBtn.addEventListener('click', () => setMenuHidden(false));

// 말풍선 하나를 만들어 붙인다. 이 시점엔 아직 답이 없을 수도 있어(생각 중...) 평범한 텍스트로만 채운다.
function addMessage(text, role) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

// 에이전트 답은 마크다운(표 포함)으로 오므로, textContent 대신 marked로 HTML 변환해 innerHTML로 넣는다.
// 표 CSS(.agent table 등)는 <style> 쪽에 이미 정의돼 있다.
function renderAgentMessage(el, text) {
  el.innerHTML = marked.parse(text);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// 입력창 제출과 메뉴 클릭이 똑같은 흐름을 타도록 질문 전송 로직을 함수 하나로 뺐다.
async function sendQuestion(question) {
  addMessage(question, 'user');
  sendBtn.disabled = true;
  // "생각 중..." 자리표시자 말풍선을 먼저 그려두고, 응답이 오면 같은 엘리먼트 내용만 바꿔치기한다.
  const pending = addMessage('생각 중...', 'agent pending');

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) {
      // FastAPI의 HTTPException은 {"detail": "..."} 형태로 온다. 있으면 그 메시지를, 없으면 상태코드만 보여준다.
      const body = await res.json().catch(() => null);
      throw new Error(body?.detail || ('서버 오류: ' + res.status));
    }
    const data = await res.json();
    renderAgentMessage(pending, data.answer);
    pending.classList.remove('pending');
  } catch (err) {
    pending.textContent = '오류가 발생했습니다: ' + err.message;
    pending.classList.remove('pending');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  sendQuestion(question);
});

// 메뉴 항목 클릭 시 그 질문을 바로 물어본다(입력창에 채워 넣지 않고 즉시 전송).
menu.addEventListener('click', (e) => {
  const item = e.target.closest('.menu-item');
  if (!item) return;
  sendQuestion(item.dataset.q);
});
</script>
</body>
</html>
